<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1" />
    </pattern>
    <radialGradient id="glowWa" cx="12%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSky" cx="90%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0E1218" />
  <rect width="1200" height="630" fill="url(#glowWa)" />
  <rect width="1200" height="630" fill="url(#glowSky)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- brand row, top left -->
  <g>
    <rect x="72" y="64" width="44" height="44" rx="12" fill="#121821" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <g fill="#0E7490">
      <circle cx="84" cy="78" r="5" />
      <circle cx="105" cy="76" r="5" />
      <circle cx="92" cy="94" r="5" />
    </g>
    <g stroke="#0E7490" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 87 80 L 101 79" />
      <path d="M 87 81 L 91 90" />
      <path d="M 103 80 L 96 91" />
    </g>
    <text x="136" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E6E8EB">Nexus Automations</text>
  </g>

  <!-- headline, left -->
  <text x="72" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#E6E8EB">
    Automation for
  </text>
  <text x="72" y="372" font-family="Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#E6E8EB">
    small businesses.
  </text>

  <text x="76" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9AA3AD">
    Built around your workflow, delivered in your timezone.
  </text>

  <!-- CTA pill, bottom left -->
  <rect x="72" y="492" width="330" height="58" rx="29" fill="#0E7490" />
  <text x="237" y="528" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">
    Free automation audit
  </text>

  <!-- tag, bottom right -->
  <g>
    <circle cx="1018" cy="522" r="6" fill="#0E7490" />
    <text x="1038" y="528" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#9AA3AD">
      WhatsApp + AI automation
    </text>
  </g>
</svg>
